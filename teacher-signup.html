<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Teacher Sign Up – Flourish & Fly</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f0f4f8;
    }

    .container {
      background-color: #fff;
      padding: 2rem 2.5rem;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.15);
      max-width: 450px;
      width: 90%;
      text-align: center;
    }

    select {
      padding: 0.75rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
      background-color: #fff;
      color: #333;
    }

    input[type="email"],
    input[type="password"] {
      padding: 0.75rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
    }

    h2 {
      margin-bottom: 1.5rem;
    }

    .switch-mode {
      margin-top: 1rem;
      font-size: 0.9rem;
    }

    .switch-mode a {
      color: #0077cc;
      text-decoration: underline;
      cursor: pointer;
    }

    #signup-error {
      color: red;
      margin-top: 1rem;
    }

    #signup-success {
      color: green;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="student-login.html">Student Login</a>
    <a href="teacher-login.html">Teacher Login</a>
    <a href="teacher-signup.html">Teacher Sign Up</a>
    <a href="teacher-dashboard.html">Dashboard</a>
  </nav>
  <script src="nav-auth.js"></script>

  <div class="container">
    <h2>Create Teacher Account</h2>
    <form id="signup-form">
      <input type="text" id="signup-first-name" placeholder="First Name" required />
      <input type="text" id="signup-last-name" placeholder="Last Name" required />
      <select id="signup-grade-level" required>
        <option value="" disabled selected>Grade Level</option>
        <option value="K">Kindergarten</option>
        <option value="1">1st Grade</option>
        <option value="2">2nd Grade</option>
        <option value="3">3rd Grade</option>
        <option value="4">4th Grade</option>
        <option value="5">5th Grade</option>
        <option value="6">6th Grade</option>
        <option value="7">7th Grade</option>
        <option value="8">8th Grade</option>
        <option value="9">9th Grade</option>
        <option value="10">10th Grade</option>
        <option value="11">11th Grade</option>
        <option value="12">12th Grade</option>
      </select>
      <select id="signup-teacher-type" required>
        <option value="" disabled selected>Teacher Type</option>
        <option value="GenEd">General Education</option>
        <option value="SPED">Special Education</option>
      </select>
      <input type="email" id="signup-email" placeholder="Email" required />
      <input type="password" id="signup-password" placeholder="Create Password" required />
      <input type="password" id="signup-confirm-password" placeholder="Confirm Password" required />
      <button type="submit">Sign Up</button>

      <p id="signup-error" class="hidden"></p>
      <p id="signup-success" class="hidden">Account created! You can now log in.</p>
    </form>

    <div class="switch-mode">
      Already have an account? <a href="teacher-login.html">Log in</a>
    </div>
  </div>

  <script src="teacher-signup.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Teacher Dashboard – Flourish & Fly</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f0f4f8;
      margin: 0;
      padding: 0;
      padding-top: 60px;
      min-height: 100vh;
      display: block;
    }

    h1 {
      text-align: center;
      margin: 20px 0 40px 0;
      color: #4b0082;
      font-family: 'Brush Script MT', cursive;
      font-size: 3rem;
    }

    .dashboard-cards {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
      max-width: 800px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .dash-card {
      background: white;
      border-radius: 14px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      padding: 40px 30px;
      text-align: center;
      width: 300px;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .dash-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 28px rgba(0,0,0,0.15);
    }

    .dash-card .card-icon {
      font-size: 3rem;
      margin-bottom: 16px;
    }

    .dash-card h2 {
      margin: 0 0 10px 0;
      color: #4b0082;
      font-size: 1.4rem;
    }

    .dash-card p {
      color: #666;
      font-size: 0.95rem;
      margin: 0;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="student-login.html">Student Login</a>
    <a href="teacher-login.html">Teacher Login</a>
    <a href="teacher-signup.html">Teacher Sign Up</a>
    <a href="teacher-dashboard.html">Dashboard</a>
  </nav>

  <h1>Teacher Dashboard</h1>

  <div class="dashboard-cards">
    <a href="class-roster.html" class="dash-card">
      <div class="card-icon">&#128203;</div>
      <h2>Class Roster</h2>
      <p>Add, edit, or upload your student roster. Manage names, grade levels, and class assignments.</p>
    </a>

    <a href="reporting-grid.html" class="dash-card">
      <div class="card-icon">&#128202;</div>
      <h2>Reporting Grid</h2>
      <p>View student assessment results by domain. See mastery levels across all math standards.</p>
    </a>
  </div>
</body>
</html>

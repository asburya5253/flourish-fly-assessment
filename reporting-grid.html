<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Assessment Reports – Flourish & Fly</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f0f4f8;
      margin: 0;
      padding: 0;
      padding-top: 60px;
      min-height: 100vh;
      display: block;
    }

    h1 {
      text-align: center;
      margin: 20px 0 40px 0;
      color: #4b0082;
      font-family: 'Brush Script MT', cursive;
      font-size: 3rem;
    }

    .reports-wrapper {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* --- Student Card --- */
    .student-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
      padding: 24px 30px;
      margin-bottom: 24px;
    }

    .student-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
    }

    .student-name {
      font-size: 1.5rem;
      font-weight: bold;
      color: #4b0082;
      font-family: 'Brush Script MT', cursive;
    }

    .topic-name {
      font-size: 1rem;
      color: #666;
      font-weight: 600;
    }

    .score-info {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .score-text {
      font-size: 1.1rem;
      font-weight: 700;
      color: #333;
    }

    /* --- Mastery Badge --- */
    .mastery-badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      border: 2px solid;
    }

    .mastery-mastered {
      color: #4CAF50;
      background-color: #e8f5e9;
      border-color: #4CAF50;
    }

    .mastery-review {
      color: #ff9800;
      background-color: #fff3e0;
      border-color: #ff9800;
    }

    .mastery-reteach {
      color: #e74c3c;
      background-color: #fdecea;
      border-color: #e74c3c;
    }

    /* --- Progress Bar --- */
    .percent-bar {
      width: 100%;
      height: 10px;
      background-color: #ddd;
      border-radius: 5px;
      overflow: hidden;
      margin: 12px 0;
    }

    .percent-fill {
      height: 100%;
      border-radius: 5px;
      transition: width 0.3s ease;
    }

    /* --- Sub-skill Table --- */
    .skill-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
    }

    .skill-table thead {
      background-color: #9370db;
      color: white;
      font-weight: bold;
    }

    .skill-table th,
    .skill-table td {
      padding: 10px 14px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }

    .skill-table th:last-child,
    .skill-table td:last-child {
      text-align: center;
    }

    .skill-table tbody tr:hover {
      background-color: #f5f0ff;
    }

    .skill-table tbody tr:last-child td {
      border-bottom: none;
    }

    /* --- Empty State --- */
    .empty-state {
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
      padding: 60px 30px;
      text-align: center;
      color: #888;
      font-size: 1.1rem;
    }

    .empty-state .empty-icon {
      font-size: 3rem;
      margin-bottom: 16px;
    }

    /* --- Back link --- */
    .back-link {
      display: block;
      text-align: center;
      margin: 24px 0;
      color: #0077cc;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="student-login.html">Student Login</a>
    <a href="teacher-login.html">Teacher Login</a>
    <a href="teacher-signup.html">Teacher Sign Up</a>
    <a href="teacher-dashboard.html">Dashboard</a>
  </nav>
  <script src="nav-auth.js"></script>

  <h1>Assessment Reports</h1>

  <div class="reports-wrapper" id="reports-wrapper">
    <!-- Populated by JS: one student card per student/topic -->
  </div>

  <a class="back-link" href="teacher-dashboard.html">Back to Dashboard</a>

  <script src="questions.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>

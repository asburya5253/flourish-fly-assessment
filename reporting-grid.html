<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reporting Grid – Flourish & Fly</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f0f4f8;
      margin: 0;
      padding: 0;
      padding-top: 60px;
      min-height: 100vh;
      display: block;
    }

    h1 {
      text-align: center;
      margin: 20px 0 40px 0;
      color: #4b0082;
      font-family: 'Brush Script MT', cursive;
      font-size: 3rem;
    }

    table {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
      border-radius: 12px;
      overflow: hidden;
      border-collapse: collapse;
    }

    thead {
      background-color: #9370db;
      color: white;
      font-weight: bold;
    }

    th, td {
      padding: 12px 15px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    tbody tr:hover {
      background-color: #f5f0ff;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    a.student-link {
      color: #0077cc;
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
    }

    a.student-link:hover {
      text-decoration: underline;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 24px;
      color: #0077cc;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="student-login.html">Student Login</a>
    <a href="teacher-login.html">Teacher Login</a>
    <a href="teacher-signup.html">Teacher Sign Up</a>
    <a href="teacher-dashboard.html">Dashboard</a>
  </nav>

  <h1>Reporting Grid</h1>

  <table>
    <thead>
      <tr>
        <th>Student</th>
        <th>Operations & Algebraic Thinking (OA)</th>
        <th>Number & Base Ten (NBT)</th>
        <th>Measurement & Data (MD)</th>
        <th>Geometry (G)</th>
      </tr>
    </thead>
    <tbody id="student-table-body">
      <!-- Rows will be populated by JS -->
    </tbody>
  </table>

  <a class="back-link" href="teacher-dashboard.html">Back to Dashboard</a>

  <script src="dashboard.js"></script>
</body>
</html>
